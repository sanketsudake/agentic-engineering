[project]
name = "l3-practical"
version = "0.1.0"
description = "L3 exam practical — implement the staged-rollout engine: gate, canary, fleet"
requires-python = ">=3.10"
dependencies = [
    "worksheet-common",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
worksheet-common = { path = "../../../labs/common", editable = true }

[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = ["live: needs a real model API key; deselected by default"]
testpaths = ["tests"]
pythonpath = ["."]
