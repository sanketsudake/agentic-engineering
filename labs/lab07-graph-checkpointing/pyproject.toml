[project]
name = "lab07-graph-checkpointing"
version = "0.1.0"
description = "Lab 7 — stateful graph agent with checkpointing"
requires-python = ">=3.10"
dependencies = [
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "langchain-core",
    "worksheet-common",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
worksheet-common = { path = "../common", editable = true }

[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = ["live: needs a real model API key; deselected by default"]
testpaths = ["tests"]
pythonpath = ["."]
