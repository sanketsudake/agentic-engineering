[project]
name = "lab06-handoffs"
version = "0.1.0"
description = "Lab 6 — multi-agent handoffs with the OpenAI Agents SDK"
requires-python = ">=3.10"
dependencies = [
    "openai-agents",
    "worksheet-common",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
worksheet-common = { path = "../common", editable = true }

[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = ["live: needs a real model API key; deselected by default"]
testpaths = ["tests"]
pythonpath = ["."]
